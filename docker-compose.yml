services:
  valkey:
    image: valkey/valkey:9.1
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api1:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      RATE_LIMIT_CAPACITY: 5
      RATE_LIMIT_REFILL_RATE: 1
    depends_on:
      valkey:
        condition: service_healthy

  api2:
    build: .
    ports:
      - "8001:8000"
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      RATE_LIMIT_CAPACITY: 5
      RATE_LIMIT_REFILL_RATE: 1
    depends_on:
      valkey:
        condition: service_healthy